version: "3.9"

services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    image: lemuriaph/go-owot-log-main:latest
    restart: unless-stopped
    environment:
      - ENV=production
    volumes:
      - ./data:/app/data
      - ./config.yml:/app/config.yml
    logging:
      driver: "json-file"
      options:
        max-size: "50m"     # max size per log file
        max-file: "5"       # number of rotated files to keep
    networks:
      - prometheus
    labels:
      prometheus.scrape: "true"
      prometheus.port: "27321"

networks:
  prometheus:
    external: true
