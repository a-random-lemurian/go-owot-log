version: "3.9"

services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    image: lemuriaph/go-owot-log-main:latest
    restart: unless-stopped
    environment:
      - ENV=production
    volumes:
      - ./data:/app/data
      - ./config.yml:/app/config.yml
    logging:
      driver: "fluentd"
      options:
        fluentd-address: localhost:24224
        tag: go-owot-log.staging
        env: "ENV"
        labels: "app_name"
    networks:
      - fluentd
      - prometheus
    labels:
      app_name: go-owot-log
      prometheus.scrape: "true"
      prometheus.port: "27321"

networks:
  prometheus:
    external: true
  fluentd:
    external: true

